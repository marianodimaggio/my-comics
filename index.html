<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pendientes — catálogo de compra</title>
<meta name="description" content="Catálogo de cómics pendientes con precios y tiendas verificadas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#0E2F38; --tinta-2:#123F4A; --papel:#EFEADD; --papel-2:#E2DACA;
  --amarillo:#F2C33D; --rojo:#D63A24; --verde:#2E8F72; --gris:#7E8C90;
  --sans:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Archivo Black','Archivo',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--tinta);color:var(--papel);font:400 15px/1.5 var(--sans)}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
header{padding:44px 0 22px;border-bottom:3px solid var(--amarillo)}
h1{font:400 clamp(34px,7vw,68px)/0.92 var(--display);letter-spacing:-.02em;margin:0;text-transform:uppercase}
h1 span{display:block;color:var(--amarillo)}
.sub{margin:14px 0 0;max-width:56ch;color:#BFCBCB}
.marcador{display:flex;flex-wrap:wrap;gap:0;margin:26px 0 0;border:1px solid rgba(239,234,221,.22)}
.marcador div{flex:1 1 120px;padding:12px 14px;border-right:1px solid rgba(239,234,221,.22)}
.marcador div:last-child{border-right:0}
.marcador b{display:block;font:400 26px/1 var(--display)}
.marcador small{color:var(--gris);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.marcador .ok b{color:var(--amarillo)}
section.grupos{padding:30px 0 6px}
h2{font:600 13px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--amarillo);margin:0 0 14px}
.grupos ul{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.grupos li{background:var(--tinta-2);padding:14px 16px;border-left:3px solid var(--amarillo)}
.grupos strong{display:block;font-size:16px}
.grupos em{font-style:normal;color:#BFCBCB;font-size:13px}
.controles{position:sticky;top:0;z-index:20;background:var(--tinta);padding:18px 0;border-bottom:1px solid rgba(239,234,221,.2);margin-top:24px}
.controles .fila{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search],select{font:400 14px var(--sans);background:var(--tinta-2);color:var(--papel);border:1px solid rgba(239,234,221,.25);padding:9px 11px;border-radius:2px}
input[type=search]{flex:1 1 260px;min-width:0}
select{max-width:200px}
.tog{display:inline-flex;align-items:center;gap:6px;background:var(--tinta-2);border:1px solid rgba(239,234,221,.25);padding:9px 11px;font-size:14px;cursor:pointer;user-select:none}
.tog input{margin:0;accent-color:var(--amarillo)}
#conteo{margin:10px 0 0;font-size:13px;color:var(--gris)}
#wf{margin:8px 0 0;font-size:13px;color:var(--amarillo);font-weight:600}
#wf.error{color:var(--rojo)}
:focus-visible{outline:2px solid var(--amarillo);outline-offset:2px}
.grilla{list-style:none;padding:26px 0 0;margin:0;display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(212px,1fr))}
.ficha{background:var(--papel);color:var(--tinta);display:flex;flex-direction:column;border-radius:2px;overflow:hidden}
.tapa{position:relative;background:var(--papel-2);aspect-ratio:2/3;display:grid;place-items:center;padding:10px}
.tapa img{width:100%;height:100%;object-fit:contain}
.ph{text-align:center;padding:10px}
.ph b{display:block;font:400 15px/1.15 var(--display);text-transform:uppercase}
.ph span{display:block;margin-top:8px;font:400 30px/1 var(--display);color:#9BA79F}
.tag{position:absolute;top:0;left:0;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;color:#fff}
.tag.enc{background:var(--verde)} .tag.ne{background:var(--rojo)} .tag.pen{background:var(--gris)}
.tag.desc{background:#4A5A5D}
.ficha.descartada{opacity:.62}
.ficha.descartada .tit{text-decoration:line-through}
.sel{position:absolute;top:6px;right:6px;width:22px;height:22px;margin:0;accent-color:var(--rojo);cursor:pointer;z-index:2}
.ficha.elegida{box-shadow:inset 0 0 0 3px var(--rojo)}
.acciones{display:flex;gap:6px;margin-top:auto}
.acciones .btn{margin-top:0}
.buscar{flex:0 0 auto;display:grid;place-items:center;width:44px;padding:0;background:transparent;color:var(--tinta);box-shadow:inset 0 0 0 2px var(--tinta);border:0;cursor:pointer}
.buscar svg{width:17px;height:17px;display:block}
.velo{position:fixed;inset:0;z-index:60;background:rgba(8,24,29,.72);display:grid;place-items:center;padding:20px}
.velo[hidden]{display:none}
.panel{background:var(--papel);color:var(--tinta);max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:22px 24px}
.panel h3{margin:0;font:400 22px/1.15 var(--display)}
.panel .col{display:block;margin-bottom:4px}
.panel dl{margin:14px 0 0;font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.panel dt{color:#5C6C6F}
.panel dd{margin:0}
.panel h4{margin:20px 0 8px;font:600 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:#5C6C6F}
.panel ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.panel ol a{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;text-decoration:none;background:var(--papel-2);font-size:13.5px;font-weight:600}
.panel ol a small{font-weight:400;color:#5C6C6F}
.panel ol a.oficial{background:var(--amarillo)}
.panel .cierre{display:flex;gap:8px;margin-top:20px}
.panel .cierre button{flex:1;padding:11px;border:0;font:600 13px var(--sans);cursor:pointer;background:var(--tinta);color:var(--papel)}
.panel .cierre button.ghost{background:transparent;color:var(--tinta);box-shadow:inset 0 0 0 2px var(--tinta)}
.barra{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--rojo);color:#fff;padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.barra[hidden]{display:none}
.barra b{font:400 17px/1 var(--display)}
.barra button{font:600 13px var(--sans);padding:9px 14px;border:0;cursor:pointer;background:#fff;color:var(--tinta)}
.barra button.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.editar{background:var(--verde);color:#fff}
.guardar{background:var(--verde);color:#fff}
.panel form{margin-top:18px;border-top:2px solid var(--tinta);padding-top:16px;display:grid;gap:8px}
.panel form label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#5C6C6F}
.panel form input,.panel form select,.panel form textarea{font:400 14px var(--sans);padding:8px 10px;border:1px solid rgba(14,47,56,.35);background:#fff;color:var(--tinta);width:100%}
.panel form textarea{min-height:64px;resize:vertical}
.panel form .fila2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.panel form button{padding:11px;border:0;background:var(--tinta);color:var(--papel);font:600 13px var(--sans);cursor:pointer}
.panel ol a.cand + button.promover{margin-top:4px;width:100%;padding:8px;border:0;background:var(--verde);color:#fff;font:600 12px var(--sans);cursor:pointer}
.accion{display:inline-flex;align-items:center;background:var(--amarillo);color:var(--tinta);text-decoration:none;font-weight:600;font-size:14px;padding:9px 13px}
.cuerpo{padding:12px 13px 13px;display:flex;flex-direction:column;gap:5px;flex:1}
.col{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5C6C6F}
.tit{font-weight:600;font-size:14px;line-height:1.25}
.tit em{font-style:normal;color:#5C6C6F;font-weight:400}
.precio{font:400 20px/1 var(--display);margin-top:2px}
.precio.nada{font-family:var(--sans);font-size:14px;font-weight:400;color:#7A8A8D}
.tienda{font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.chip{font-size:10.5px;padding:2px 6px;border:1px solid rgba(14,47,56,.3);border-radius:999px}
.chip.free{border-color:var(--verde);color:var(--verde)}
.chip.usado{border-color:#8A6A1E;color:#8A6A1E}
.chip.aviso{border-color:var(--rojo);color:var(--rojo)}
.chip.cand{border-color:#7A4FBF;color:#7A4FBF;font-weight:600}
.chip.edit{border-color:#B8860B;color:#B8860B;font-weight:600;background:#F7EFD6}
.panel ol a.cand{background:#EDE6F7}
.panel ol a.cand.caido{background:var(--papel-2);opacity:.7}
.panel ol a.cand.caido span:first-child{text-decoration:line-through}
.panel .conf{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;padding:2px 6px;border-radius:999px;color:#fff}
.panel .conf.alta{background:var(--verde)} .panel .conf.media{background:#B8860B} .panel .conf.baja{background:var(--gris)}
.fecha{font-size:11px;color:#5C6C6F}
.fecha.vieja{color:var(--rojo);font-weight:600}
.obs{font-size:11.5px;color:#4A5A5D;line-height:1.35}
.btn{margin-top:auto;display:block;text-align:center;text-decoration:none;font-weight:600;font-size:13px;padding:10px;background:var(--tinta);color:var(--papel);border:0;width:100%;cursor:pointer}
.btn.opciones{background:transparent;color:var(--tinta);box-shadow:inset 0 0 0 2px var(--tinta)}
.btn[disabled]{background:var(--papel-2);color:#8A9698;cursor:not-allowed}
#mas{display:block;margin:26px auto 0;padding:13px 26px;background:var(--amarillo);color:var(--tinta);border:0;font:600 14px var(--sans);cursor:pointer}
#mas[hidden]{display:none}
.vacio,.estado{padding:40px 0;color:var(--gris)}
.estado.error{color:var(--amarillo)}
footer{padding:40px 0 60px;color:var(--gris);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Lo que me falta<span>y dónde comprarlo</span></h1>
  <p class="sub">Catálogo de los tomos pendientes de 41 colecciones. Solo aparece precio cuando hay una publicación real detrás; nada se estima.</p>
  <div class="marcador" id="marcador"></div>
</header>

<section class="grupos">
  <h2>Compras agrupadas por tienda</h2>
  <ul id="grupos"></ul>
</section>

<div class="controles" id="controles" hidden>
  <div class="fila">
    <input type="search" id="q" placeholder="Buscar por colección, título, número o tienda" aria-label="Buscar">
    <select id="fcol" aria-label="Colección"></select>
    <select id="fest" aria-label="Estado">
      <option value="">Todos los estados</option>
      <option value="encontrado">Encontrado</option>
      <option value="no_encontrado">No encontrado</option>
      <option value="pendiente">Pendiente</option>
      <option value="descartada">Descartada</option>
    </select>
    <select id="ftie" aria-label="Tienda"></select>
    <select id="orden" aria-label="Orden">
      <option value="prioridad">Prioridad de compra</option>
      <option value="precio_asc">Precio: menor a mayor</option>
      <option value="precio_desc">Precio: mayor a menor</option>
      <option value="coleccion">Colección</option>
      <option value="tienda">Tienda</option>
    </select>
    <label class="tog"><input type="checkbox" id="fenvio"> Envío gratis</label>
    <label class="tog"><input type="checkbox" id="fusado"> Usado</label>
    <label class="tog"><input type="checkbox" id="fviejo"> Revalidar precio</label>
    <label class="tog"><input type="checkbox" id="fedit"> Falta la editorial</label>
    <button type="button" class="accion" id="revalidar">Revalidar precios</button>
    <button type="button" class="accion" id="buscarcand">Buscar candidatos</button>
    <button type="button" class="tog" id="descartarcol" hidden>Descartar coleccion</button>
    <button type="button" class="tog" id="selvis">Elegir todos los visibles</button>
    <button type="button" class="tog" id="cfg" title="Configurar el token de GitHub para poder editar">Modo edicion</button>
    <button type="button" class="accion guardar" id="guardar" hidden>Guardar 0 cambios</button>
  </div>
  <p id="conteo"></p>
  <p id="wf" hidden></p>
</div>

<p class="estado" id="estado">Cargando el catálogo…</p>
<ul class="grilla" id="grilla"></ul>
<button id="mas" hidden>Mostrar más</button>

<div class="velo" id="velo" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>

<div class="barra" id="barra" hidden>
  <b id="barracount">0</b>
  <span>tomos elegidos para buscar</span>
  <button type="button" id="copiar">Copiar el lote</button>
  <button type="button" class="ghost" id="limpiar">Limpiar</button>
</div>

<footer id="pie">Fuente de datos: <code>data/comics.json</code>.</footer>
</div>

<script>
const ORDEN_ESTADO = {encontrado:0, no_encontrado:1, pendiente:2, descartada:3};
const DIAS_VIEJO = 30;
const fmt = (n, moneda) => n == null ? 'sin precio'
  : (moneda === 'USD' ? 'USD ' + n.toFixed(2) : '$' + n.toLocaleString('es-AR'));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dias = f => Math.floor((Date.now() - new Date(f + 'T12:00:00').getTime()) / 86400000);
const revalidar = i => i.precio && (!i.fecha_verificacion || dias(i.fecha_verificacion) > DIAS_VIEJO);

let ITEMS = [], ctrl = [], limite = 60;
let EDITORIALES = {};   // editorial -> tienda oficial

// La regla "editorial primero" deja de depender de la memoria: cada tomo
// registra en editorial_chequeada la fecha en que se miro la tienda de su
// editorial. Si el campo esta vacio, la ficha lo avisa.
const tiendaEditorial = i => (i.editorial && EDITORIALES[i.editorial]) || null;
const faltaEditorial = i => {
  const t = tiendaEditorial(i);
  if (!t || i.estado === 'descartada') return false;
  if (i.editorial_chequeada) return false;
  return i.tienda !== t.nombre;
};

async function cargar() {
  try {
    const r = await fetch('data/comics.json?t=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    ITEMS = d.items;
    try {
      const e = await fetch('data/editoriales.json?t=' + Date.now(), {cache: 'no-store'});
      if (e.ok) {
        const je = await e.json();
        (je.editoriales || []).forEach(x => {
          if (x.tienda_oficial) EDITORIALES[x.editorial] =
            {nombre: x.editorial + ' (editorial)', url: x.tienda_oficial,
             manual: x.scrapeable !== true};
        });
      }
    } catch (err) { /* sin mapa de editoriales, el catalogo funciona igual */ }
    document.getElementById('pie').innerHTML =
      `Datos actualizados el ${esc(d.actualizado)} · fuente: <code>data/comics.json</code> · ` +
      `los precios sin verificar en los últimos ${DIAS_VIEJO} días hay que revalidarlos antes de comprar.`;
    arrancar();
  } catch (e) {
    document.getElementById('estado').className = 'estado error';
    document.getElementById('estado').textContent =
      'No se pudo cargar data/comics.json (' + e.message + '). Si abriste el archivo con doble clic, el navegador bloquea la lectura: subilo a GitHub Pages o levantá un servidor local.';
  }
}

function arrancar() {
  document.getElementById('estado').hidden = true;
  document.getElementById('controles').hidden = false;

  const activos = ITEMS.filter(i => i.estado !== 'descartada');
  const desc = ITEMS.filter(i => i.estado === 'descartada');
  const enc = activos.filter(i => i.estado === 'encontrado');
  const marcador = [
    [String(activos.length), 'faltantes'],
    [String(new Set(activos.map(i => i.coleccion)).size), 'colecciones'],
    [String(enc.length), 'encontrados', 'ok'],
    [String(enc.filter(i => i.tipo_enlace === 'especifico').length), 'con URL de producto'],
    [String(enc.filter(i => i.tipo_enlace === 'general').length), 'solo enlace general'],
    [String(activos.filter(i => i.estado === 'no_encontrado').length), 'no encontrados'],
    [String(activos.filter(i => i.estado === 'pendiente').length), 'sin investigar'],
    [String(activos.filter(revalidar).length), 'a revalidar'],
    [String(desc.length), 'descartadas'],
    [String(activos.filter(i => (i.candidatos || []).length).length), 'con candidatos'],
    [String(activos.filter(faltaEditorial).length), 'sin chequear editorial'],
  ];
  document.getElementById('marcador').innerHTML = marcador
    .map(([v, l, c]) => `<div class="${c || ''}"><b>${v}</b><small>${l}</small></div>`).join('');

  const porTienda = {};
  enc.forEach(i => (porTienda[i.tienda] = porTienda[i.tienda] || []).push(i));
  document.getElementById('grupos').innerHTML = Object.entries(porTienda)
    .filter(([, v]) => v.length > 1)
    .sort((a, b) => b[1].length - a[1].length)
    .map(([t, v]) => {
      const total = v.reduce((s, i) => s + (i.precio || 0), 0);
      const gratis = v.every(i => (i.envio || '').includes('gratis'));
      const que = v.map(i => `${i.coleccion.split('.')[0]} #${i.numero}`).join(', ');
      return `<li><strong>${esc(t)} — ${v.length} tomos</strong>
        <em>${fmt(total)}${gratis ? ' · envío gratis' : ''}<br>${esc(que)}</em></li>`;
    }).join('') || '<li><em>Todavía no hay dos tomos encontrados en la misma tienda.</em></li>';

  const sel = (id, vals, todo) => {
    document.getElementById(id).innerHTML = `<option value="">${todo}</option>` +
      vals.map(v => `<option>${esc(v)}</option>`).join('');
  };
  sel('fcol', [...new Set(ITEMS.map(i => i.coleccion))].sort(), 'Todas las colecciones');
  sel('ftie', [...new Set(ITEMS.map(i => i.tienda).filter(Boolean))].sort(), 'Todas las tiendas');

  ctrl = ['q','fcol','fest','ftie','orden','fenvio','fusado','fviejo','fedit'].map(id => document.getElementById(id));
  ctrl.forEach(e => e.addEventListener('input', () => { limite = 60; pintar(); }));
  document.getElementById('mas').addEventListener('click', () => { limite += 120; pintar(); });

  document.getElementById('grilla').addEventListener('click', e => {
    const b = e.target.closest('[data-buscar]');
    if (!b) return;
    const it = ITEMS.find(x => x.id === b.dataset.buscar);
    if (it) abrirPanel(it);
  });
  document.getElementById('velo').addEventListener('click', e => {
    if (e.target.id === 'velo' || e.target.closest('[data-cerrar]')) return cerrarPanel();
    const p = e.target.closest('[data-pedir]');
    if (p) { seleccion.add(p.dataset.pedir); pintarBarra(); pintar(); cerrarPanel(); copiarLote(); return; }

    const enc = e.target.closest('[data-encolar]');
    if (enc) {
      const form = document.querySelector(`form[data-id="${enc.dataset.encolar}"]`);
      encolar(enc.dataset.encolar, leerForm(form));
      cerrarPanel();
      return;
    }

    const ch = e.target.closest('[data-chequeada]');
    if (ch) { encolar(ch.dataset.chequeada, {editorial_chequeada: hoy()}); cerrarPanel(); return; }

    const pr = e.target.closest('[data-promover]');
    if (pr) {
      const it = ITEMS.find(x => x.id === pr.dataset.promover);
      const c = it.candidatos[Number(pr.dataset.cand)];
      encolar(it.id, {
        estado: 'encontrado', tienda: c.tienda, url_producto: c.url, tipo_enlace: 'especifico',
        precio: c.precio ?? null, moneda: c.moneda || 'ARS',
        stock: typeof c.stock === 'string' ? c.stock : (c.stock != null ? c.stock + ' unidades' : null),
        fecha_verificacion: c.verificado || hoy(),
      });
      cerrarPanel();
    }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarPanel(); });

  document.getElementById('grilla').addEventListener('change', e => {
    const c = e.target.closest('.sel');
    if (!c) return;
    c.checked ? seleccion.add(c.dataset.id) : seleccion.delete(c.dataset.id);
    c.closest('.ficha').classList.toggle('elegida', c.checked);
    pintarBarra();
  });
  document.getElementById('selvis').addEventListener('click', () => {
    filtrados().slice(0, limite).filter(necesitaBusqueda).forEach(i => seleccion.add(i.id));
    pintarBarra(); pintar();
  });
  document.getElementById('copiar').addEventListener('click', copiarLote);
  document.getElementById('cfg').addEventListener('click', configurarToken);
  document.getElementById('revalidar').addEventListener('click',
    () => correrWorkflow('refresh.yml', {}, 'Revalidar precios'));
  document.getElementById('buscarcand').addEventListener('click', () => {
    const col = document.getElementById('fcol').value;
    correrWorkflow('buscar.yml', col ? {coleccion: col} : {cantidad: '10'},
      col ? 'Buscar en ' + col : 'Buscar 10 pendientes');
  });
  document.getElementById('descartarcol').addEventListener('click', descartarColeccion);
  document.getElementById('fcol').addEventListener('change', () => {
    document.getElementById('descartarcol').hidden =
      !editable() || !document.getElementById('fcol').value;
  });
  document.getElementById('guardar').addEventListener('click', guardarCambios);
  pintarGuardar();
  document.getElementById('limpiar').addEventListener('click', () => {
    seleccion.clear(); pintarBarra(); pintar();
  });

  pintar();
}

// ---------------------------------------------------------------- GitHub
const GH = {owner:'marianodimaggio', repo:'my-comics', path:'data/comics.json', branch:'main'};
let token = '';
try { token = localStorage.getItem('gh_token') || ''; } catch (e) { token = ''; }
const cola = new Map();            // id del tomo -> campos a cambiar
const hoy = () => new Date().toISOString().slice(0, 10);
const editable = () => !!token;

const cab = () => ({Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json'});

async function ghLeer() {
  const r = await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}?ref=${GH.branch}&t=${Date.now()}`,
    {headers: cab(), cache: 'no-store'});
  if (!r.ok) throw new Error('No pude leer el archivo (HTTP ' + r.status + ')');
  const j = await r.json();
  const bytes = Uint8Array.from(atob(j.content.replace(/\s/g, '')), c => c.charCodeAt(0));
  return {sha: j.sha, data: JSON.parse(new TextDecoder().decode(bytes))};
}

async function ghEscribir(data, sha, mensaje) {
  const txt = JSON.stringify(data, null, 1);
  const bytes = new TextEncoder().encode(txt);
  let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  const r = await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`,
    {method: 'PUT', headers: cab(),
     body: JSON.stringify({message: mensaje, content: btoa(bin), sha, branch: GH.branch})});
  if (!r.ok) throw new Error('No pude guardar (HTTP ' + r.status + '): ' + (await r.text()).slice(0, 160));
  return r.json();
}

// Clave: relee el archivo del repo, aplica los cambios encima y recien
// entonces guarda. Asi nunca pisa lo que escribio el regenerador.
async function guardarCambios() {
  const btn = document.getElementById('guardar');
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Guardando...';
  try {
    const {sha, data} = await ghLeer();
    let tocados = 0;
    data.items.forEach(item => {
      const campos = cola.get(item.id);
      if (!campos) return;
      const nombres = Object.keys(campos).filter(k => k !== '_historial');
      Object.assign(item, campos);
      delete item._historial;
      item.historial = item.historial || [];
      item.historial.push(`${hoy()}: editado desde el catalogo (${nombres.join(', ')})`);
      tocados++;
    });
    data.actualizado = hoy();
    await ghEscribir(data, sha, `Edicion desde el catalogo: ${tocados} tomo(s)`);
    ITEMS = data.items;
    cola.clear();
    pintarGuardar();
    pintar();
    btn.textContent = 'Guardado';
    setTimeout(() => { btn.disabled = false; pintarGuardar(); }, 2000);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = original;
    alert('No se pudo guardar.\n\n' + e.message +
      '\n\nSi dice 401 o 403, el token esta vencido o sin permiso de escritura. Si dice 409, ' +
      'alguien mas cambio el archivo: volve a intentar y se reaplica solo.');
  }
}

function pintarGuardar() {
  const b = document.getElementById('guardar');
  b.hidden = cola.size === 0;
  b.textContent = `Guardar ${cola.size} cambio${cola.size === 1 ? '' : 's'}`;
  document.getElementById('cfg').textContent = editable() ? 'Edicion activa' : 'Modo edicion';
}

function configurarToken() {
  const actual = token ? '(hay un token guardado)' : '(no hay token)';
  const t = prompt(
    'Pega tu token de GitHub para poder editar desde esta pagina ' + actual +
    '\n\nCrealo en github.com/settings/personal-access-tokens/new con:' +
    '\n  - Repository access: solo my-comics' +
    '\n  - Permissions > Contents: Read and write' +
    '\n\nSe guarda unicamente en este navegador, nunca en el repositorio.' +
    '\nDejalo vacio y aceptá para borrarlo.', '');
  if (t === null) return;
  token = t.trim();
  try {
    if (token) localStorage.setItem('gh_token', token);
    else localStorage.removeItem('gh_token');
  } catch (e) { alert('Tu navegador no permite guardar el token; va a durar solo esta sesion.'); }
  pintarGuardar();
  pintar();
}

// ------------------------------------------------- correr workflows de Actions
const API = `https://api.github.com/repos/${GH.owner}/${GH.repo}`;

function aviso(txt, error) {
  const p = document.getElementById('wf');
  p.hidden = !txt;
  p.className = error ? 'error' : '';
  p.textContent = txt || '';
}

async function recargarDesdeRepo() {
  const {data} = await ghLeer();
  ITEMS = data.items;
  pintar();
}

const dormir = ms => new Promise(r => setTimeout(r, ms));

async function correrWorkflow(archivo, inputs, etiqueta) {
  if (!editable()) return alert('Activa el modo edicion primero: hace falta el token.');
  const desde = Date.now() - 20000;
  aviso(etiqueta + ': arrancando...');
  try {
    const r = await fetch(`${API}/actions/workflows/${archivo}/dispatches`,
      {method: 'POST', headers: cab(),
       body: JSON.stringify({ref: GH.branch, inputs: inputs || {}})});
    if (r.status !== 204) {
      const t = await r.text();
      throw new Error('HTTP ' + r.status + ' ' + t.slice(0, 140));
    }

    let id = null;
    for (let i = 0; i < 60; i++) {          // hasta ~6 minutos
      await dormir(6000);
      const q = await fetch(`${API}/actions/workflows/${archivo}/runs?per_page=5`,
        {headers: cab(), cache: 'no-store'});
      const j = await q.json();
      const run = (j.workflow_runs || []).find(x =>
        (id && x.id === id) || (!id && new Date(x.created_at).getTime() >= desde));
      if (!run) { aviso(etiqueta + ': esperando que arranque...'); continue; }
      id = run.id;
      if (run.status !== 'completed') {
        aviso(`${etiqueta}: corriendo (${run.status})...`);
        continue;
      }
      if (run.conclusion !== 'success') {
        aviso(`${etiqueta}: termino con error (${run.conclusion}). Mira el log en Actions.`, true);
        return;
      }
      await recargarDesdeRepo();
      aviso(etiqueta + ': listo, datos actualizados.');
      setTimeout(() => aviso(''), 8000);
      return;
    }
    aviso(etiqueta + ': tarda mas de lo esperado. Revisa Actions.', true);
  } catch (e) {
    aviso(`${etiqueta}: no se pudo lanzar. ${e.message}` +
      (String(e.message).includes('403') || String(e.message).includes('404')
        ? ' Al token le falta el permiso Actions: Read and write.' : ''), true);
  }
}

                                 motivo_descarte: motivo.trim() || 'Sin motivo declarado'}));
}

function encolar(id, campos) {
  const previo = cola.get(id) || {};
  cola.set(id, Object.assign(previo, campos));
  const it = ITEMS.find(x => x.id === id);
  if (it) Object.assign(it, campos);   // vista optimista
  pintarGuardar();
  pintar();
}

function leerForm(form) {
  const campos = {};
  new FormData(form).forEach((val, k) => {
    let v = typeof val === 'string' ? val.trim() : val;
    if (k === 'precio') v = v === '' ? null : Number(v);
    else if (v === '') v = null;
    campos[k] = v;
  });
  const it = ITEMS.find(x => x.id === form.dataset.id) || {};
  if (campos.url_producto) campos.tipo_enlace = 'especifico';
  else if (it.url_general) campos.tipo_enlace = 'general';
  else campos.tipo_enlace = 'ninguno';
  if (campos.precio != null) campos.fecha_verificacion = hoy();
  return campos;
}

function pintarBarra() {
  const b = document.getElementById('barra');
  b.hidden = seleccion.size === 0;
  document.getElementById('barracount').textContent = seleccion.size;
}

function loteTexto() {
  const elegidos = ITEMS.filter(i => seleccion.has(i.id));
  const lineas = elegidos.map(i => {
    const d = [];
    if (i.titulo) d.push(i.titulo);
    d.push('editorial: ' + (i.editorial || 'desconocida'));
    d.push('idioma: ' + (i.idioma || 'desconocido'));
    if (i.estado === 'encontrado') d.push('tengo ' + i.tienda + ' a $' + i.precio + ' pero sin URL de producto');
    if (i.estado === 'no_encontrado') d.push('ya lo busque y no aparecio');
    return `- ${i.coleccion} #${i.numero} — ${d.join(' — ')}`;
  });
  return 'Busca opciones de compra para estos tomos, arrancando por la tienda de la editorial:\n\n' +
         lineas.join('\n');
}

async function copiarLote() {
  const txt = loteTexto();
  const btn = document.getElementById('copiar');
  try {
    await navigator.clipboard.writeText(txt);
    btn.textContent = 'Copiado, pegalo en el chat';
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    btn.textContent = 'Copiado, pegalo en el chat';
  }
  setTimeout(() => { btn.textContent = 'Copiar el lote'; }, 2600);
}

const prioridad = i =>
  ORDEN_ESTADO[i.estado] * 10 + (i.estado === 'encontrado' && i.tipo_enlace !== 'especifico' ? 1 : 0);

function filtrados() {
  const [q, fcol, fest, ftie, orden, fenvio, fusado, fviejo, fedit] = ctrl;
  const t = q.value.trim().toLowerCase();
  const r = ITEMS.filter(i => {
    if (i.estado === 'descartada' && fest.value !== 'descartada') return false;
    if (fcol.value && i.coleccion !== fcol.value) return false;
    if (fest.value && i.estado !== fest.value) return false;
    if (ftie.value && i.tienda !== ftie.value) return false;
    if (fenvio.checked && !(i.envio || '').includes('gratis')) return false;
    if (fusado.checked && i.condicion !== 'usado') return false;
    if (fviejo.checked && !revalidar(i)) return false;
    if (fedit.checked && !faltaEditorial(i)) return false;
    if (t) {
      const blob = [i.coleccion, i.numero, i.titulo, i.tienda, i.editorial].filter(Boolean).join(' ').toLowerCase();
      if (!blob.includes(t)) return false;
    }
    return true;
  });
  const cmp = {
    prioridad: (a, b) => prioridad(a) - prioridad(b) || a.coleccion.localeCompare(b.coleccion) || parseFloat(a.numero) - parseFloat(b.numero),
    precio_asc: (a, b) => (a.precio ?? 1e12) - (b.precio ?? 1e12),
    precio_desc: (a, b) => (b.precio ?? -1) - (a.precio ?? -1),
    coleccion: (a, b) => a.coleccion.localeCompare(b.coleccion) || parseFloat(a.numero) - parseFloat(b.numero),
    tienda: (a, b) => (a.tienda || 'zzz').localeCompare(b.tienda || 'zzz'),
  }[orden.value];
  return r.sort(cmp);
}

function ficha(i) {

    ? `<img src="${esc(i.cover_url)}" alt="${esc(alt)}" loading="lazy" decoding="async"
         onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',innerHTML:'<b>${esc(i.coleccion)}</b><span>#${esc(i.numero)}</span>'}))">`
    : `<div class="ph"><b>${esc(i.coleccion)}</b><span>#${esc(i.numero)}</span></div>`;

  if (i.precio_transferencia) chips.push('<span class="chip">Por transferencia</span>');
  if (i.condicion === 'usado') chips.push('<span class="chip usado">Usado</span>');
  if (i.stock) chips.push(`<span class="chip">${esc(i.stock)}</span>`);
  if (i.estado === 'encontrado' && i.tipo_enlace === 'general') chips.push('<span class="chip aviso">Enlace general; falta confirmar producto</span>');
  const cands = i.candidatos || [];
  if (cands.length) chips.push(`<span class="chip cand">${cands.length} candidato${cands.length > 1 ? 's' : ''} a revisar</span>`);
  if (faltaEditorial(i)) chips.push('<span class="chip edit">Falta chequear la editorial</span>');

  let btn;
  if (i.tipo_enlace === 'especifico') btn = `<a class="btn" href="${esc(i.url_producto)}" target="_blank" rel="noopener">Comprar</a>`;
  else if (i.tipo_enlace === 'general') btn = `<a class="btn opciones" href="${esc(i.url_general)}" target="_blank" rel="noopener">Ver opciones</a>`;
  else if (i.estado === 'descartada') btn = '<button class="btn" disabled>Descartada</button>';
  else btn = `<button class="btn" disabled>${i.estado === 'no_encontrado' ? 'Sin publicación' : 'Pendiente'}</button>`;

  let fecha = '';
  if (i.fecha_verificacion) {
    const d = dias(i.fecha_verificacion);
    fecha = `<span class="fecha${d > DIAS_VIEJO ? ' vieja' : ''}">Verificado el ${esc(i.fecha_verificacion)}${d > DIAS_VIEJO ? ` · hace ${d} días` : ''}</span>`;
  } else if (i.precio) {
    fecha = '<span class="fecha vieja">Sin fecha de verificación</span>';
  }

  const motivo = i.motivo_descarte
    ? `<span class="obs">No me interesa: ${esc(i.motivo_descarte)}</span>` : '';

  const check = necesitaBusqueda(i)
    ? `<input class="sel" type="checkbox" data-id="${esc(i.id)}" aria-label="Elegir para buscar"
        ${seleccion.has(i.id) ? 'checked' : ''}>` : '';
  const lupa = buscable(i)
    ? `<button type="button" class="buscar" data-buscar="${esc(i.id)}" title="Ver donde buscar este tomo"
         aria-label="Ver donde buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></button>` : '';

  return `<li class="ficha${i.estado === 'descartada' ? ' descartada' : ''}${seleccion.has(i.id) ? ' elegida' : ''}">
    <div class="tapa">${tapa}<span class="tag ${tag[0]}">${tag[1]}</span>${check}</div>
    <div class="cuerpo">
      <span class="col">${esc(i.coleccion)}</span>
      <span class="tit">#${esc(i.numero)}${i.titulo ? ' — ' + esc(i.titulo) : ' <em>sin título</em>'}</span>
      <span class="precio${i.precio ? '' : ' nada'}">${i.precio ? fmt(i.precio, i.moneda) : 'Precio pendiente'}</span>
      ${i.tienda ? `<span class="tienda">${esc(i.tienda)}</span>` : ''}
      ${chips.length ? `<span class="chips">${chips.join('')}</span>` : ''}
      ${fecha}
      ${motivo}
      ${i.observaciones ? `<span class="obs">${esc(i.observaciones)}</span>` : ''}
      <span class="acciones">${btn}${lupa}</span>
    </div></li>`;
}

function pintar() {
  if (!ctrl.length) return;          // todavia no arranco la interfaz
  const r = filtrados();
  document.getElementById('grilla').innerHTML = r.length
    ? r.slice(0, limite).map(ficha).join('')
    : '<li class="vacio">Ningún tomo coincide. Probá quitando un filtro.</li>';
  document.getElementById('conteo').textContent = `Mostrando ${Math.min(limite, r.length)} de ${r.length} tomos`;
  const mas = document.getElementById('mas');
  const faltan = Math.max(0, r.length - limite);
  mas.hidden = faltan === 0;
  mas.textContent = `Mostrar ${Math.min(120, faltan)} más (quedan ${faltan})`;
}

cargar();
</script>
</body>
</html>
