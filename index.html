<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lo que me falta</title>
<meta name="description" content="Catalogo de comics pendientes con precios y tiendas verificadas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#EFF0EC; --papel-2:#E3E5DF; --papel-3:#D5D8D1;
  --key:#14161A; --key-60:#5E6469; --key-40:#8A9095;
  --magenta:#D4006B; --cian:#0080BE; --amarillo:#F2B900; --verde:#0F7A5A;
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --sans:'Instrument Sans',system-ui,-apple-system,sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--key);font:400 15.5px/1.55 var(--sans)}
a{color:inherit}
button{font:inherit}
:focus-visible{outline:2.5px solid var(--magenta);outline-offset:2px;border-radius:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}

header{padding:52px 0 0}
h1{margin:0;font:700 clamp(40px,8vw,76px)/0.94 var(--display);letter-spacing:-.025em;max-width:16ch}
.resumen{margin:20px 0 0;font-size:17px;color:var(--key-60);max-width:62ch}
.resumen b{color:var(--key);font-weight:600}

.compra{margin:34px 0 0;background:var(--key);color:var(--papel);border-radius:var(--r);padding:26px 28px;display:grid;gap:18px}
.compra h2{margin:0;font:500 14px/1 var(--sans);color:var(--key-40)}
.oferta{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:flex-end;justify-content:space-between}
.plata{font:700 clamp(32px,6vw,50px)/1 var(--display);letter-spacing:-.02em}
.plata small{display:block;font:400 14px/1.45 var(--sans);color:var(--key-40);letter-spacing:0;margin-top:8px;max-width:44ch}
.donde{margin:0;font-size:15.5px;max-width:40ch}
.donde em{font-style:normal;color:var(--key-40)}
.ir{background:var(--magenta);color:#fff;border:0;border-radius:7px;padding:13px 20px;font-weight:600;cursor:pointer;white-space:nowrap}
.otras{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid rgba(239,240,236,.16);padding-top:16px}
.otras button{background:transparent;color:var(--papel);border:1px solid rgba(239,240,236,.28);border-radius:99px;padding:7px 13px;font-size:13.5px;cursor:pointer}
.otras button:hover{border-color:var(--papel)}

.barra{position:sticky;top:0;z-index:30;background:var(--papel);padding:16px 0;margin-top:38px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--papel-3)}
.buscar{flex:1 1 230px;min-width:0;position:relative}
.buscar input{width:100%;font:400 15px var(--sans);padding:11px 13px 11px 38px;border:1px solid var(--papel-3);border-radius:7px;background:#fff;color:var(--key)}
.buscar svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--key-40)}
.pill{background:#fff;border:1px solid var(--papel-3);border-radius:7px;padding:11px 14px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.pill:hover{border-color:var(--key-40)}
.pill[aria-expanded=true]{background:var(--key);color:var(--papel);border-color:var(--key)}
.pill .n{background:var(--magenta);color:#fff;border-radius:99px;font-size:11.5px;font-weight:600;padding:1px 7px}
.pill.guardar{background:var(--magenta);color:#fff;border-color:var(--magenta)}

.cajon{display:none;padding:20px 0 6px;border-bottom:1px solid var(--papel-3)}
.cajon.abierto{display:block}
.grupo{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cajon select{font:400 14.5px var(--sans);padding:9px 11px;border:1px solid var(--papel-3);border-radius:7px;background:#fff;color:var(--key)}
.check{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--papel-3);border-radius:7px;padding:9px 12px;font-size:14.5px;cursor:pointer}
.check input{margin:0;accent-color:var(--magenta)}
.cifras{display:flex;flex-wrap:wrap;gap:4px 20px;margin:16px 0 0;font-size:13.5px;color:var(--key-60)}
.cifras b{color:var(--key);font-weight:600}
.limpiar{background:none;border:0;color:var(--magenta);font-weight:600;cursor:pointer;padding:9px 2px}
.nota{margin:14px 0 0;font-size:13.5px;color:var(--key-60);max-width:72ch}

.conteo{margin:18px 0 0;font-size:13.5px;color:var(--key-60)}
.grilla{list-style:none;padding:20px 0 0;margin:0;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(196px,1fr))}
.ficha{background:#fff;border:1px solid var(--papel-3);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.ficha.elegida{border-color:var(--magenta);box-shadow:0 0 0 2px var(--magenta)}
.ficha.descartada{opacity:.5}
.tapa{position:relative;background:var(--papel-2);aspect-ratio:2/3;display:grid;place-items:center;overflow:hidden}
.tapa img{width:100%;height:100%;object-fit:cover;object-position:center top}
.ph{text-align:center;color:var(--key-60);padding:12px}
.ph b{display:block;font:500 14px/1.2 var(--display)}
.ph i{display:block;font-style:normal;font:700 26px/1.1 var(--display);color:var(--key-40);margin-top:6px}
.sel{position:absolute;top:9px;right:9px;width:21px;height:21px;margin:0;accent-color:var(--magenta);cursor:pointer;z-index:2}
.cuerpo{padding:13px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.linea{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--key-60)}
.punto{width:7px;height:7px;border-radius:99px;flex:0 0 auto}
.punto.enc{background:var(--verde)} .punto.ne{background:var(--magenta)}
.punto.pen{background:var(--key-40)} .punto.desc{background:var(--papel-3)}
.tit{font-weight:600;font-size:14.5px;line-height:1.3}
.tit span{color:var(--key-60);font-weight:400}
.precio{font:700 21px/1.1 var(--display);letter-spacing:-.01em;margin-top:1px}
.precio.nada{font:400 14px var(--sans);color:var(--key-40)}
.precio s{font:400 13px var(--sans);color:var(--key-40);margin-left:6px}
.tienda{font-size:13.5px;color:var(--key-60)}
.marcas{display:flex;flex-wrap:wrap;gap:5px}
.marca{font-size:11px;font-weight:500;padding:2px 7px;border-radius:99px;border:1px solid var(--papel-3);color:var(--key-60)}
.marca.free{border-color:var(--verde);color:var(--verde)}
.marca.avisa{border-color:var(--amarillo);color:#8A6A00;background:#FCF4DD}
.marca.cand{border-color:var(--cian);color:var(--cian)}
.acciones{display:flex;gap:7px;margin-top:auto;padding-top:4px}
.cta{flex:1;text-align:center;text-decoration:none;font-weight:600;font-size:13.5px;padding:10px;border-radius:7px;border:0;cursor:pointer;background:var(--key);color:var(--papel)}
.cta.suave{background:#fff;color:var(--key);box-shadow:inset 0 0 0 1.5px var(--key)}
.cta[disabled]{background:var(--papel-2);color:var(--key-40);cursor:default;box-shadow:none}
.lupa{flex:0 0 auto;width:42px;display:grid;place-items:center;background:#fff;border-radius:7px;box-shadow:inset 0 0 0 1.5px var(--papel-3);border:0;cursor:pointer;color:var(--key)}
.lupa:hover{box-shadow:inset 0 0 0 1.5px var(--key)}
.lupa svg{width:16px;height:16px}
#mas{display:block;margin:28px auto 0;padding:13px 24px;background:#fff;border:1px solid var(--papel-3);border-radius:7px;font-weight:600;cursor:pointer}
#mas[hidden]{display:none}
.vacio,.cargando{padding:44px 0;color:var(--key-60)}
.cargando.error{color:var(--magenta);font-weight:500}

/* vista de detalle */
.detalle{padding:24px 0 40px}
.detalle[hidden]{display:none}
.volver{background:none;border:0;color:var(--key-60);font-weight:600;cursor:pointer;padding:6px 0;display:inline-flex;gap:8px;align-items:center}
.volver:hover{color:var(--key)}
.dcols{display:grid;gap:28px;margin-top:14px}
@media(min-width:860px){.dcols{grid-template-columns:300px 1fr;gap:40px;align-items:start}
  .dizq{position:sticky;top:84px}}
.dtapa{width:100%;background:var(--papel-2);border-radius:var(--r);display:block;aspect-ratio:2/3;object-fit:contain}
.dtapa.ph{display:grid;place-items:center;text-align:center;color:var(--key-40);font:700 30px var(--display)}
.dcta{display:grid;gap:8px;margin-top:14px}
.dcta a,.dcta button{display:block;text-align:center;text-decoration:none;font-weight:600;font-size:14.5px;padding:13px;border-radius:7px;border:0;cursor:pointer;background:var(--key);color:var(--papel)}
.dcta .suave{background:transparent;color:var(--key);box-shadow:inset 0 0 0 1.5px var(--key)}
.dcta [disabled]{background:var(--papel-2);color:var(--key-40);cursor:default;box-shadow:none}
.detalle h2.dtit{margin:6px 0 0;font:700 clamp(28px,5vw,44px)/1.08 var(--display);letter-spacing:-.02em}
.detalle h4{margin:28px 0 10px;font:600 13.5px var(--sans);color:var(--key-60);border-top:1px solid var(--papel-3);padding-top:18px}
.meta{margin:16px 0 0;display:grid;grid-template-columns:auto 1fr;gap:7px 18px;font-size:14.5px}
.meta dt{color:var(--key-60)}
.meta dd{margin:0}
.meta dd.falta{color:var(--magenta)}
.detalle ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.detalle ol a{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:13px 15px;background:#fff;border:1px solid var(--papel-3);border-radius:8px;text-decoration:none;font-size:14.5px;font-weight:600}
.detalle ol a:hover{border-color:var(--key)}
.detalle ol a small{display:block;font-weight:400;color:var(--key-60);margin-top:2px}
.detalle ol a.oficial{border-left:4px solid var(--cian)}
.detalle ol a.caido{opacity:.6}
.detalle ol a.caido>span:first-child{text-decoration:line-through}
.conf{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:99px;color:#fff;white-space:nowrap}
.conf.alta{background:var(--verde)} .conf.media{background:#8A6A00} .conf.baja{background:var(--key-40)}
.mini{width:100%;margin-top:6px;padding:10px;border:0;border-radius:7px;background:var(--cian);color:#fff;font-weight:600;font-size:13px;cursor:pointer}
.hist{font-size:13px;color:var(--key-60);display:grid;gap:4px}
/* formulario */
.pasos{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:1px;background:var(--papel-3);border:1px solid var(--papel-3);border-radius:var(--r);overflow:hidden}
.pasos li{background:#fff;padding:13px 15px;display:flex;gap:12px;align-items:flex-start}
.pasos li.ok{background:#F2F6F3}
.pasos .marca-paso{flex:0 0 auto;width:18px;height:18px;border-radius:99px;margin-top:2px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:var(--key-40)}
.pasos li.ok .marca-paso{background:var(--verde)}
.pasos li.urgente .marca-paso{background:var(--magenta)}
.pasos b{display:block;font-size:14.5px;font-weight:600}
.pasos span{font-size:13.5px;color:var(--key-60)}
.pasos button{background:none;border:0;color:var(--magenta);font-weight:600;font-size:13.5px;cursor:pointer;padding:4px 0 0}
.tabs{display:flex;gap:6px;margin:26px 0 0;border-bottom:1px solid var(--papel-3)}
.tabs button{background:none;border:0;padding:12px 14px;font:600 14.5px var(--sans);color:var(--key-60);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--key);border-bottom-color:var(--magenta)}
.tabs .aviso{background:var(--magenta);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:6px}
.hoja[hidden]{display:none}
.mercado{margin:18px 0 0;padding:13px 15px;background:#fff;border:1px solid var(--papel-3);border-left:4px solid var(--cian);border-radius:8px;font-size:14px}
.mercado b{font-weight:600}
.tapabox{margin:18px 0 0;padding:16px;background:#fff;border:1px solid var(--papel-3);border-radius:var(--r)}
.tapabox p{margin:0 0 12px;font-size:14px;color:var(--key-60)}
.tapabox .acc{display:flex;flex-wrap:wrap;gap:8px}
.tapabox .acc button,.tapabox .acc a{border:0;border-radius:7px;padding:11px 15px;font:600 13.5px var(--sans);cursor:pointer;background:var(--cian);color:#fff;text-decoration:none}
.tapabox .acc .suave{background:#fff;color:var(--key);box-shadow:inset 0 0 0 1.5px var(--papel-3)}
.seccion{margin-top:26px;border-top:1px solid var(--papel-3);padding-top:18px}
.seccion h5{margin:0 0 4px;font:600 15px var(--sans)}
.seccion p.para{margin:0 0 14px;font-size:13.5px;color:var(--key-60);max-width:66ch}
.campos{display:grid;gap:16px;margin-top:4px}
@media(min-width:620px){.campos{grid-template-columns:1fr 1fr}.campos .ancho{grid-column:1 / -1}}
.campos label{font-size:13px;color:var(--key-60);display:grid;gap:5px}
.campos input,.campos select,.campos textarea{font:400 15px var(--sans);padding:11px 12px;border:1px solid var(--papel-3);border-radius:7px;background:#fff;color:var(--key);width:100%}
.campos input:focus,.campos textarea:focus{border-color:var(--key)}
.campos textarea{min-height:96px;resize:vertical}
.campos .pista{font-size:12px;color:var(--key-40)}
.guardabarra{position:sticky;bottom:0;background:var(--papel);border-top:1px solid var(--papel-3);padding:14px 0;margin-top:24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.guardabarra button{background:var(--magenta);color:#fff;border:0;border-radius:7px;padding:13px 22px;font-weight:600;cursor:pointer}
.guardabarra button[disabled]{background:var(--papel-3);color:var(--key-40);cursor:default}
.guardabarra .estado{font-size:13.5px;color:var(--key-60)}
.guardabarra .estado.ok{color:var(--verde);font-weight:600}
.guardabarra .estado.mal{color:var(--magenta);font-weight:600}
#wf{margin:12px 0 0;font-size:14px;font-weight:500;color:var(--cian)}
#wf.error{color:var(--magenta)}
.flotante{position:fixed;left:16px;right:16px;bottom:16px;z-index:40;background:var(--key);color:var(--papel);border-radius:10px;padding:13px 16px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.flotante[hidden]{display:none}
.flotante b{font:700 18px var(--display)}
.flotante button{border:0;border-radius:7px;padding:9px 14px;font-weight:600;font-size:13.5px;cursor:pointer;background:var(--papel);color:var(--key)}
.flotante button.suave{background:transparent;color:var(--papel);box-shadow:inset 0 0 0 1.5px rgba(239,240,236,.5)}
footer{padding:44px 0 120px;color:var(--key-60);font-size:13px;max-width:76ch}
footer code{background:var(--papel-2);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Lo que me falta</h1>
  <p class="resumen" id="resumen">Cargando el catalogo.</p>
</header>

<section class="compra" id="compra" hidden>
  <h2>La compra que conviene cerrar</h2>
  <div class="oferta">
    <div class="plata" id="compraTotal"></div>
    <p class="donde" id="compraDonde"></p>
    <button type="button" class="ir" id="compraIr">Ver estos tomos</button>
  </div>
  <div class="otras" id="compraOtras"></div>
</section>

<div class="barra">
  <div class="buscar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    <input type="search" id="q" placeholder="Buscar coleccion, titulo, numero o tienda" aria-label="Buscar">
  </div>
  <button type="button" class="pill" id="bFiltros" aria-expanded="false" aria-controls="filtros">Filtros <span class="n" id="nFiltros" hidden>0</span></button>
  <button type="button" class="pill" id="bTools" aria-expanded="false" aria-controls="tools">Herramientas</button>
  <button type="button" class="pill guardar" id="guardar" hidden>Guardar 0</button>
</div>

<div class="cajon" id="filtros">
  <div class="grupo">
    <select id="fcol" aria-label="Coleccion"></select>
    <select id="fest" aria-label="Estado">
      <option value="">Cualquier estado</option>
      <option value="encontrado">Con donde comprarlo</option>
      <option value="no_encontrado">Buscado sin resultado</option>
      <option value="pendiente">Sin investigar</option>
      <option value="descartada">Descartadas</option>
    </select>
    <select id="ftie" aria-label="Tienda"></select>
    <select id="orden" aria-label="Orden">
      <option value="prioridad">Listos para comprar primero</option>
      <option value="precio_asc">Mas barato primero</option>
      <option value="precio_desc">Mas caro primero</option>
      <option value="coleccion">Por coleccion</option>
      <option value="tienda">Por tienda</option>
    </select>
    <label class="check"><input type="checkbox" id="fenvio"> Envio gratis</label>
    <label class="check"><input type="checkbox" id="fusado"> Usado</label>
    <label class="check"><input type="checkbox" id="fviejo"> Precio a revalidar</label>
    <label class="check"><input type="checkbox" id="fedit"> Falta ver la editorial</label>
    <button type="button" class="limpiar" id="limpiarFiltros">Limpiar</button>
  </div>
  <div class="cifras" id="cifras"></div>
</div>

<div class="cajon" id="tools">
  <div class="grupo">
    <button type="button" class="pill" id="cfg">Activar edicion</button>
    <button type="button" class="pill" id="revalidar">Revalidar precios</button>
    <button type="button" class="pill" id="buscarcand">Buscar candidatos</button>
    <button type="button" class="pill" id="traertapas">Traer tapas de Whakoom</button>
    <button type="button" class="pill" id="descartarcol" hidden>Descartar la coleccion elegida</button>
  </div>
  <p class="nota" id="toolsNota"></p>
  <p id="wf" hidden></p>
</div>

<div id="lista">
<p class="conteo" id="conteo"></p>
<p class="cargando" id="cargando">Cargando.</p>
<ul class="grilla" id="grilla"></ul>
<button id="mas" hidden>Mostrar mas</button>
</div>

<section class="detalle" id="detalle" hidden></section>

<footer id="pie"></footer>
</div>


<div class="flotante" id="barraSel" hidden>
  <b id="selCount">0</b>
  <span>elegidos para buscar</span>
  <button type="button" id="copiar">Copiar la lista</button>
  <button type="button" class="suave" id="limpiarSel">Vaciar</button>
</div>

<script>
const GH = {owner:'marianodimaggio', repo:'my-comics', path:'data/comics.json', branch:'main'};
const API = `https://api.github.com/repos/${GH.owner}/${GH.repo}`;
const ORDEN_ESTADO = {encontrado:0, no_encontrado:1, pendiente:2, descartada:3};
const DIAS_VIEJO = 30;
const OPC_ESTADO = ['encontrado','no_encontrado','pendiente','descartada'];
const NOMBRE_ESTADO = {encontrado:'Con donde comprarlo', no_encontrado:'Buscado sin resultado',
                       pendiente:'Sin investigar', descartada:'Descartada'};

const TIENDAS_AR = [
  {n:'Historieteca', u:'https://historieteca.mitiendanube.com/search/?q=', ed:'Historieteca'},
  {n:'Hotel de las Ideas', u:'https://hoteldelasideastienda.com.ar/search/?q=', ed:'Hotel de las Ideas', manual:true},
  {n:'Cultura Guiso', u:'https://culturaguiso.com/search/?q='},
  {n:"It's a Trap!", u:'https://www.itsatrapcomicstore.ar/search/?q='},
  {n:'Rey Esteban', u:'https://www.reyesteban.com/search/?q='},
  {n:'Quiosquito Virtual', u:'https://www.quiosquitovirtual.com.ar/search/?q='},
  {n:'MercadoLibre', u:'https://listado.mercadolibre.com.ar/'},
];
const MARKETPLACES = [
  {n:'MercadoLibre', u:'https://listado.mercadolibre.com.ar/', nota:'usado, lotes y vendedores particulares'},
];
const TIENDAS_EN = [
  {n:'MyComicShop', u:'https://www.mycomicshop.com/search?q=', nota:'numeros atrasados y tomos'},
  {n:'InStockTrades', u:'https://www.instocktrades.com/search?ps=true', nota:'tomos con descuento, hay que tipear', sinTermino:true},
  {n:'Amazon', u:'https://www.amazon.com/s?k=', nota:'nuevos y de terceros'},
  {n:'eBay', u:'https://www.ebay.com/sch/i.html?_nkw=', nota:'sueltos y lotes'},
];

let ITEMS = [], ctrl = [], limite = 60, EDITORIALES = {};
const seleccion = new Set();
const cola = new Map();
let token = '';
try { token = localStorage.getItem('gh_token') || ''; } catch (e) {}

const hoy = () => new Date().toISOString().slice(0,10);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plata = (n, m) => n == null ? '' : (m === 'USD' ? 'USD ' + n.toFixed(2) : '$' + n.toLocaleString('es-AR'));
const dias = f => Math.floor((Date.now() - new Date(f + 'T12:00:00').getTime()) / 86400000);
const revalidar = i => !!i.precio && (!i.fecha_verificacion || dias(i.fecha_verificacion) > DIAS_VIEJO);
const editable = () => !!token;
const comprable = i => i.estado === 'encontrado' && i.tipo_enlace === 'especifico';
const necesitaBusqueda = i => i.estado !== 'descartada' && !comprable(i);
const termino = i => [i.coleccion, i.titulo || i.numero].filter(Boolean).join(' ');
const enIngles = i => /ingl|english/i.test(i.idioma || '');

// De que mercado es este tomo. Define que tiendas tiene sentido ofrecer.
function mercado(i) {
  const t = (i.idioma || '') + ' ' + (i.editorial || '');
  if (/ingl|english|estados unidos/i.test(t)) return 'us';
  if (/argentin/i.test(t)) return 'ar';
  if (/espa[nñ]a/i.test(t)) return 'es';
  if (i.idioma) return 'ar';
  return null;
}
const NOMBRE_MERCADO = {ar:'Argentina', es:'Espana', us:'Estados Unidos'};
const gratis = i => /gratis|sin cargo/i.test(i.envio || '');

const tiendaEditorial = i => (i.editorial && EDITORIALES[i.editorial]) || null;
const faltaEditorial = i => {
  const t = tiendaEditorial(i);
  return !!t && i.estado !== 'descartada' && !i.editorial_chequeada && i.tienda !== t.nombre;
};

const cab = () => ({Authorization:'Bearer ' + token, Accept:'application/vnd.github+json'});

async function ghLeer() {
  const r = await fetch(`${API}/contents/${GH.path}?ref=${GH.branch}&t=${Date.now()}`,
    {headers: cab(), cache:'no-store'});
  if (!r.ok) throw new Error('no pude leer el archivo (HTTP ' + r.status + ')');
  const j = await r.json();
  const bytes = Uint8Array.from(atob(j.content.replace(/\s/g,'')), c => c.charCodeAt(0));
  return {sha: j.sha, data: JSON.parse(new TextDecoder().decode(bytes))};
}

async function ghEscribir(data, sha, mensaje) {
  const bytes = new TextEncoder().encode(JSON.stringify(data, null, 1));
  let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  const r = await fetch(`${API}/contents/${GH.path}`, {method:'PUT', headers: cab(),
    body: JSON.stringify({message: mensaje, content: btoa(bin), sha, branch: GH.branch})});
  if (!r.ok) throw new Error('no pude guardar (HTTP ' + r.status + '): ' + (await r.text()).slice(0,150));
  return r.json();
}

async function guardarCambios(silencioso) {
  const b = document.getElementById('guardar');
  b.disabled = true; b.textContent = 'Guardando';
  try {
    const {sha, data} = await ghLeer();
    let n = 0;
    data.items.forEach(item => {
      const campos = cola.get(item.id);
      if (!campos) return;
      Object.assign(item, campos);
      item.historial = item.historial || [];
      item.historial.push(`${hoy()}: editado desde el catalogo (${Object.keys(campos).join(', ')})`);
      n++;
    });
    data.actualizado = hoy();
    await ghEscribir(data, sha, `Edicion desde el catalogo: ${n} tomo(s)`);
    ITEMS = data.items; cola.clear();
    b.textContent = 'Guardado'; pintar(); pintarCompra(); sincronizarFiltros();
    aviso('Guardado en el repositorio. La pagina publicada se actualiza en un minuto.');
    setTimeout(() => aviso(''), 6000);
    setTimeout(() => { b.disabled = false; pintarGuardar(); }, 1800);
  } catch (e) {
    b.disabled = false; pintarGuardar();
    if (silencioso) throw e;
    alert('No se guardo.\n\n' + e.message +
      '\n\n401 o 403: el token vencio o le falta permiso de escritura. 409: el archivo cambio, reintenta y se reaplica solo.');
  }
}

function pintarGuardar() {
  const b = document.getElementById('guardar');
  b.hidden = cola.size === 0;
  b.textContent = 'Guardar ' + cola.size;
  document.getElementById('cfg').textContent = editable() ? 'Edicion activa' : 'Activar edicion';
  document.getElementById('toolsNota').textContent = editable()
    ? 'Edicion activa en este navegador. Los cambios se escriben en el repositorio.'
    : 'Para editar datos o correr los procesos hace falta pegar un token de GitHub, una vez por navegador.';
}

function configurarToken() {
  const t = prompt('Pega tu token de GitHub' + (token ? ' (ya hay uno guardado)' : '') +
    '\n\nCrealo en github.com/settings/personal-access-tokens/new con acceso solo a my-comics y los permisos Contents y Actions en Read and write.' +
    '\n\nSe guarda solo en este navegador, nunca en el repositorio. Dejalo vacio para borrarlo.', '');
  if (t === null) return;
  token = t.trim();
  try { token ? localStorage.setItem('gh_token', token) : localStorage.removeItem('gh_token'); } catch (e) {}
  pintarGuardar(); pintar();
}

const dormir = ms => new Promise(r => setTimeout(r, ms));
function aviso(txt, error) {
  const p = document.getElementById('wf');
  p.hidden = !txt; p.className = error ? 'error' : ''; p.textContent = txt || '';
}

async function recargarDesdeRepo() {
  const {data} = await ghLeer();
  ITEMS = data.items; pintar(); pintarCompra(); sincronizarFiltros();
}

async function correrWorkflow(archivo, inputs, etiqueta) {
  if (!editable()) return alert('Activa la edicion primero: hace falta el token.');
  document.getElementById('tools').classList.add('abierto');
  const desde = Date.now() - 20000;
  aviso(etiqueta + ': arrancando');
  try {
    const r = await fetch(`${API}/actions/workflows/${archivo}/dispatches`,
      {method:'POST', headers: cab(), body: JSON.stringify({ref: GH.branch, inputs: inputs || {}})});
    if (r.status !== 204) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0,120));
    let id = null;
    for (let k = 0; k < 60; k++) {
      await dormir(6000);
      const q = await fetch(`${API}/actions/workflows/${archivo}/runs?per_page=5`, {headers: cab(), cache:'no-store'});
      const j = await q.json();
      const run = (j.workflow_runs || []).find(x => (id && x.id === id) ||
        (!id && new Date(x.created_at).getTime() >= desde));
      if (!run) { aviso(etiqueta + ': esperando que arranque'); continue; }
      id = run.id;
      if (run.status !== 'completed') { aviso(etiqueta + ': corriendo'); continue; }
      if (run.conclusion !== 'success') {
        return aviso(`${etiqueta}: termino con error (${run.conclusion}). El detalle esta en Actions.`, true);
      }
      await recargarDesdeRepo();
      aviso(etiqueta + ': listo, datos actualizados');
      setTimeout(() => aviso(''), 8000);
      return;
    }
    aviso(etiqueta + ': tarda mas de lo esperado. Revisa Actions.', true);
  } catch (e) {
    aviso(`${etiqueta}: no arranco. ${e.message}` +
      (/40[34]/.test(e.message) ? ' Al token le falta el permiso Actions en Read and write.' : ''), true);
  }
}

function descartarColeccion() {
  const col = document.getElementById('fcol').value;
  if (!col) return;
  const motivo = prompt('Motivo para descartar ' + col + ':', 'No la voy a completar');
  if (motivo === null) return;
  ITEMS.filter(i => i.coleccion === col && i.estado !== 'descartada')
    .forEach(i => encolar(i.id, {estado:'descartada', estado_previo:i.estado,
                                motivo_descarte: motivo.trim() || 'Sin motivo'}));
  if (editable()) guardarCambios();
}

function encolar(id, campos) {
  cola.set(id, Object.assign(cola.get(id) || {}, campos));
  const it = ITEMS.find(x => x.id === id);
  if (it) Object.assign(it, campos);
  pintarGuardar(); pintar(); pintarCompra(); sincronizarFiltros();
}

// Un gesto, un guardado. Antes quedaba encolado y se perdia al refrescar.
async function encolarYGuardar(id, campos) {
  encolar(id, campos);
  if (!editable()) return;
  await guardarCambios();
}

function leerForm(form) {
  const campos = {};
  new FormData(form).forEach((val, k) => {
    let v = typeof val === 'string' ? val.trim() : val;
    if (k === 'precio' || k === 'precio_transferencia') v = v === '' ? null : Number(v);
    else if (v === '') v = null;
    campos[k] = v;
  });
  const it = ITEMS.find(x => x.id === form.dataset.id) || {};
  campos.tipo_enlace = campos.url_producto ? 'especifico' : (it.url_general ? 'general' : 'ninguno');
  if (campos.precio != null) campos.fecha_verificacion = hoy();
  return campos;
}

function pintarSel() {
  document.getElementById('barraSel').hidden = seleccion.size === 0;
  document.getElementById('selCount').textContent = seleccion.size;
}

async function copiarLista() {
  const txt = 'Busca opciones de compra para estos tomos, arrancando por la tienda de la editorial:\n\n' +
    ITEMS.filter(i => seleccion.has(i.id)).map(i => {
      const d = [];
      if (i.titulo) d.push(i.titulo);
      d.push('editorial: ' + (i.editorial || 'desconocida'));
      d.push('idioma: ' + (i.idioma || 'desconocido'));
      if (i.estado === 'encontrado') d.push('tengo ' + i.tienda + ' a ' + plata(i.precio, i.moneda) + ' sin URL de producto');
      if (i.estado === 'no_encontrado') d.push('ya lo busque sin resultado');
      return `- ${i.coleccion} #${i.numero} — ${d.join(' — ')}`;
    }).join('\n');
  const b = document.getElementById('copiar');
  try { await navigator.clipboard.writeText(txt); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  b.textContent = 'Copiado, pegalo en el chat';
  setTimeout(() => { b.textContent = 'Copiar la lista'; }, 2600);
}

const totalDeColeccion = col =>
  ITEMS.filter(i => i.coleccion === col && i.estado !== 'descartada').length;

function gruposCompra() {
  const g = {};
  ITEMS.filter(comprable).forEach(i => (g[i.tienda] = g[i.tienda] || []).push(i));
  return Object.entries(g).map(([tienda, lista]) => ({
    tienda, lista,
    total: lista.reduce((s, i) => s + (i.precio || 0), 0),
    transferencia: lista.every(i => i.precio_transferencia)
      ? lista.reduce((s, i) => s + i.precio_transferencia, 0) : null,
    gratis: lista.every(gratis),
    moneda: lista[0].moneda || 'ARS',
  })).sort((a, b) => b.lista.length - a.lista.length || a.total - b.total);
}

function verTienda(tienda) {
  document.getElementById('ftie').value = tienda;
  document.getElementById('fest').value = 'encontrado';
  limite = 60; sincronizarFiltros(); pintar();
  document.getElementById('grilla').scrollIntoView({block:'start', behavior:'smooth'});
}

function pintarCompra() {
  const gs = gruposCompra().filter(x => x.lista.length > 1);
  const sec = document.getElementById('compra');
  if (!gs.length) { sec.hidden = true; return; }
  sec.hidden = false;
  const t = gs[0];
  const cierra = t.lista.length === totalDeColeccion(t.lista[0].coleccion) &&
    new Set(t.lista.map(i => i.coleccion)).size === 1;
  document.getElementById('compraTotal').innerHTML =
    plata(t.transferencia || t.total, t.moneda) +
    `<small>${t.lista.length} tomos en ${esc(t.tienda)}${t.gratis ? ', envio gratis' : ''}${
      t.transferencia ? ', pagando por transferencia en lugar de ' + plata(t.total, t.moneda) : ''}</small>`;
  document.getElementById('compraDonde').innerHTML =
    t.lista.map(i => esc(i.coleccion) + ' ' + esc(i.numero)).join(', ') +
    `<br><em>${cierra ? 'Cierra la coleccion completa.' : 'Un solo envio.'}</em>`;
  document.getElementById('compraIr').onclick = () => verTienda(t.tienda);
  document.getElementById('compraOtras').innerHTML = gs.slice(1, 5).map(x =>
    `<button type="button" data-tienda="${esc(x.tienda)}">${esc(x.tienda)}: ${x.lista.length} tomos, ${plata(x.transferencia || x.total, x.moneda)}</button>`).join('');
}

async function cargar() {
  try {
    const r = await fetch('data/comics.json?t=' + Date.now(), {cache:'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    ITEMS = d.items;
    try {
      const e = await fetch('data/editoriales.json?t=' + Date.now(), {cache:'no-store'});
      if (e.ok) (await e.json()).editoriales.forEach(x => {
        if (x.tienda_oficial) EDITORIALES[x.editorial] =
          {nombre: x.editorial + ' (editorial)', url: x.tienda_oficial, manual: x.scrapeable !== true};
      });
    } catch (err) {}
    document.getElementById('pie').innerHTML =
      `Datos del ${esc(d.actualizado)}, en <code>data/comics.json</code>. Nada esta estimado: si no hay una publicacion real detras, el tomo figura sin precio. Los precios con mas de ${DIAS_VIEJO} dias hay que revalidarlos antes de comprar.`;
    arrancar();
  } catch (e) {
    const c = document.getElementById('cargando');
    c.className = 'cargando error';
    c.textContent = 'No se pudo cargar data/comics.json (' + e.message +
      '). Si abriste el archivo con doble clic, el navegador bloquea la lectura: subilo a GitHub Pages o levanta un servidor local.';
  }
}

function arrancar() {
  document.getElementById('cargando').hidden = true;
  const activos = ITEMS.filter(i => i.estado !== 'descartada');
  document.getElementById('resumen').innerHTML =
    `<b>${activos.length} tomos</b> pendientes en ${new Set(activos.map(i => i.coleccion)).size} colecciones. ` +
    `<b>${activos.filter(comprable).length}</b> con publicacion verificada y boton de compra. ` +
    `${activos.filter(i => i.estado === 'pendiente').length} todavia sin investigar.`;

  const sel = (id, vals, todo) => {
    document.getElementById(id).innerHTML = `<option value="">${todo}</option>` +
      vals.map(v => `<option>${esc(v)}</option>`).join('');
  };
  sel('fcol', [...new Set(ITEMS.map(i => i.coleccion))].sort(), 'Cualquier coleccion');
  sel('ftie', [...new Set(ITEMS.map(i => i.tienda).filter(Boolean))].sort(), 'Cualquier tienda');

  ctrl = ['q','fcol','fest','ftie','orden','fenvio','fusado','fviejo','fedit']
    .map(id => document.getElementById(id));
  ctrl.forEach(e => e.addEventListener('input', () => { limite = 60; sincronizarFiltros(); pintar(); }));

  const alternar = (id, boton) =>
    boton.setAttribute('aria-expanded', String(document.getElementById(id).classList.toggle('abierto')));
  document.getElementById('bFiltros').addEventListener('click', e => alternar('filtros', e.currentTarget));
  document.getElementById('bTools').addEventListener('click', e => alternar('tools', e.currentTarget));
  document.getElementById('limpiarFiltros').addEventListener('click', () => {
    ctrl.forEach(c => { if (c.type === 'checkbox') c.checked = false; else if (c.id !== 'orden') c.value = ''; });
    limite = 60; sincronizarFiltros(); pintar();
  });
  document.getElementById('mas').addEventListener('click', () => { limite += 120; pintar(); });
  document.getElementById('cfg').addEventListener('click', configurarToken);
  document.getElementById('guardar').addEventListener('click', guardarCambios);
  document.getElementById('revalidar').addEventListener('click',
    () => correrWorkflow('refresh.yml', {}, 'Revalidar precios'));
  document.getElementById('buscarcand').addEventListener('click', () => {
    const col = document.getElementById('fcol').value;
    correrWorkflow('buscar.yml', col ? {coleccion: col} : {cantidad:'10'},
      col ? 'Buscar en ' + col : 'Buscar 10 pendientes');
  });
  document.getElementById('traertapas').addEventListener('click', () => {
    const col = document.getElementById('fcol').value;
    correrWorkflow('tapas.yml', col ? {coleccion: col} : {},
      col ? 'Tapas de ' + col : 'Tapas de todas las ediciones');
  });
  document.getElementById('descartarcol').addEventListener('click', descartarColeccion);
  document.getElementById('copiar').addEventListener('click', copiarLista);
  document.getElementById('limpiarSel').addEventListener('click',
    () => { seleccion.clear(); pintarSel(); pintar(); });
  document.getElementById('compraOtras').addEventListener('click', e => {
    const b = e.target.closest('[data-tienda]');
    if (b) verTienda(b.dataset.tienda);
  });

  document.getElementById('grilla').addEventListener('click', e => {
    const b = e.target.closest('[data-buscar]');
    if (!b) return;
    const it = ITEMS.find(x => x.id === b.dataset.buscar);
    if (it) irATomo(it.id);
  });
  document.getElementById('grilla').addEventListener('change', e => {
    const c = e.target.closest('.sel');
    if (!c) return;
    c.checked ? seleccion.add(c.dataset.id) : seleccion.delete(c.dataset.id);
    c.closest('.ficha').classList.toggle('elegida', c.checked);
    pintarSel();
  });

  // acciones dentro de la vista de detalle
  document.getElementById('detalle').addEventListener('click', e => {
    if (e.target.closest('[data-volver]')) return volverALista();
    if (e.target.closest('#bguardar')) return guardarDetalle();

    const tab = e.target.closest('[data-hoja]');
    if (tab) {
      document.querySelectorAll('.tabs button').forEach(b =>
        b.setAttribute('aria-selected', String(b === tab)));
      ['comprar','completar','historial'].forEach(k =>
        document.getElementById('hoja-' + k).hidden = k !== tab.dataset.hoja);
      return;
    }

    const wf = e.target.closest('[data-wf]');
    if (wf) {
      const it = ITEMS.find(x => x.id === tomoActual);
      if (wf.dataset.wf === 'tapas')
        return correrWorkflow('tapas.yml', {coleccion: it.coleccion}, 'Tapas de ' + it.coleccion)
          .then(() => ruta());
      return correrWorkflow('refresh.yml', {}, 'Revalidar precios').then(() => ruta());
    }
    const foco = e.target.closest('[data-foco]');
    if (foco) {
      const campo = document.querySelector(`[data-campo="${foco.dataset.foco}"]`);
      if (campo) {
        campo.scrollIntoView({block:'center', behavior:'smooth'});
        const input = campo.querySelector('input, select, textarea');
        if (input) setTimeout(() => input.focus(), 300);
      }
      return;
    }
    const pedir = e.target.closest('[data-pedir]');
    if (pedir) { seleccion.add(pedir.dataset.pedir); pintarSel(); copiarLista(); return; }
    const chk = e.target.closest('[data-chequeada]');
    if (chk) return encolarYGuardar(chk.dataset.chequeada, {editorial_chequeada: hoy()})
      .then(() => renderDetalle(ITEMS.find(x => x.id === chk.dataset.chequeada)));
    const pro = e.target.closest('[data-promover]');
    if (pro) {
      const it = ITEMS.find(x => x.id === pro.dataset.promover);
      const c = it.candidatos[Number(pro.dataset.cand)];
      return encolarYGuardar(it.id, {estado:'encontrado', tienda:c.tienda, url_producto:c.url,
        tipo_enlace:'especifico', precio: c.precio == null ? null : c.precio, moneda: c.moneda || 'ARS',
        stock: typeof c.stock === 'string' ? c.stock : (c.stock == null ? null : c.stock + ' unidades'),
        envio: c.envio || it.envio || null, fecha_verificacion: c.verificado || hoy(),
        editorial_chequeada: /editorial/i.test(c.tienda) ? hoy() : (it.editorial_chequeada || null)})
        .then(() => renderDetalle(ITEMS.find(x => x.id === it.id)));
    }
  });

  window.addEventListener('hashchange', ruta);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !document.getElementById('detalle').hidden) volverALista();
  });

  pintarGuardar(); pintarCompra(); sincronizarFiltros(); pintar(); ruta();
}

function sincronizarFiltros() {
  if (!ctrl.length) return;
  const activos = ctrl.filter(c => c.id !== 'q' && c.id !== 'orden')
    .filter(c => c.type === 'checkbox' ? c.checked : !!c.value).length;
  const n = document.getElementById('nFiltros');
  n.hidden = activos === 0; n.textContent = activos;
  document.getElementById('descartarcol').hidden =
    !editable() || !document.getElementById('fcol').value;

  const a = ITEMS.filter(i => i.estado !== 'descartada');
  const cifras = [
    ['con boton de compra', a.filter(comprable).length],
    ['con tienda pero sin URL del producto', a.filter(i => i.estado === 'encontrado' && i.tipo_enlace !== 'especifico').length],
    ['con candidatos por revisar', a.filter(i => (i.candidatos || []).length).length],
    ['buscados sin resultado', a.filter(i => i.estado === 'no_encontrado').length],
    ['sin investigar', a.filter(i => i.estado === 'pendiente').length],
    ['con precio a revalidar', a.filter(revalidar).length],
    ['falta ver la editorial', a.filter(faltaEditorial).length],
    ['descartados', ITEMS.length - a.length],
  ];
  document.getElementById('cifras').innerHTML =
    cifras.map(c => `<span><b>${c[1]}</b> ${c[0]}</span>`).join('');
}

const prioridad = i => ORDEN_ESTADO[i.estado] * 10 + (comprable(i) ? 0 : 1);

function filtrados() {
  const [q, fcol, fest, ftie, orden, fenvio, fusado, fviejo, fedit] = ctrl;
  const t = q.value.trim().toLowerCase();
  const r = ITEMS.filter(i => {
    if (i.estado === 'descartada' && fest.value !== 'descartada') return false;
    if (fcol.value && i.coleccion !== fcol.value) return false;
    if (fest.value && i.estado !== fest.value) return false;
    if (ftie.value && i.tienda !== ftie.value) return false;
    if (fenvio.checked && !gratis(i)) return false;
    if (fusado.checked && i.condicion !== 'usado') return false;
    if (fviejo.checked && !revalidar(i)) return false;
    if (fedit.checked && !faltaEditorial(i)) return false;
    if (t && ![i.coleccion, i.numero, i.titulo, i.tienda, i.editorial]
      .filter(Boolean).join(' ').toLowerCase().includes(t)) return false;
    return true;
  });
  const cmp = {
    prioridad: (a, b) => prioridad(a) - prioridad(b) || a.coleccion.localeCompare(b.coleccion) || parseFloat(a.numero) - parseFloat(b.numero),
    precio_asc: (a, b) => (a.precio == null ? 1e12 : a.precio) - (b.precio == null ? 1e12 : b.precio),
    precio_desc: (a, b) => (b.precio == null ? -1 : b.precio) - (a.precio == null ? -1 : a.precio),
    coleccion: (a, b) => a.coleccion.localeCompare(b.coleccion) || parseFloat(a.numero) - parseFloat(b.numero),
    tienda: (a, b) => (a.tienda || 'zzz').localeCompare(b.tienda || 'zzz'),
  }[orden.value];
  return cmp ? r.sort(cmp) : r;
}

function ficha(i) {
  const punto = {encontrado:'enc', no_encontrado:'ne', pendiente:'pen', descartada:'desc'}[i.estado];
  const alt = `Tapa de ${i.coleccion} ${i.numero}${i.titulo ? ': ' + i.titulo : ''}`;
  const tapa = i.cover_url
    ? `<img src="${esc(i.cover_url)}" alt="${esc(alt)}" loading="lazy" decoding="async"
        onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',innerHTML:'<b>${esc(i.coleccion)}</b><i>${esc(i.numero)}</i>'}))">`
    : `<div class="ph"><b>${esc(i.coleccion)}</b><i>${esc(i.numero)}</i></div>`;

  const marcas = [];
  if (gratis(i)) marcas.push('<span class="marca free">Envio gratis</span>');
  if (i.condicion === 'usado') marcas.push('<span class="marca">Usado</span>');
  if ((i.candidatos || []).some(c => c.vigente !== false)) marcas.push('<span class="marca cand">Candidatos</span>');
  if (faltaEditorial(i)) marcas.push('<span class="marca avisa">Falta ver la editorial</span>');
  if (i.estado === 'encontrado' && i.tipo_enlace === 'general') marcas.push('<span class="marca avisa">Sin URL del producto</span>');
  if (revalidar(i)) marcas.push('<span class="marca avisa">Precio viejo</span>');

  let cta;
  if (i.tipo_enlace === 'especifico') cta = `<a class="cta" href="${esc(i.url_producto)}" target="_blank" rel="noopener">Comprar</a>`;
  else if (i.tipo_enlace === 'general') cta = `<a class="cta suave" href="${esc(i.url_general)}" target="_blank" rel="noopener">Ver opciones</a>`;
  else cta = `<button class="cta" disabled>${i.estado === 'descartada' ? 'Descartada'
    : i.estado === 'no_encontrado' ? 'Sin publicacion' : 'Sin buscar'}</button>`;

  return `<li class="ficha${i.estado === 'descartada' ? ' descartada' : ''}${seleccion.has(i.id) ? ' elegida' : ''}">
    <div class="tapa">${tapa}${necesitaBusqueda(i) ? `<input class="sel" type="checkbox" data-id="${esc(i.id)}"
      aria-label="Elegir para buscar" ${seleccion.has(i.id) ? 'checked' : ''}>` : ''}</div>
    <div class="cuerpo">
      <span class="linea"><span class="punto ${punto}"></span>${esc(i.coleccion)}</span>
      <span class="tit">${esc(i.numero)}${i.titulo ? ' ' + esc(i.titulo) : ' <span>sin titulo</span>'}</span>
      <span class="precio${i.precio ? '' : ' nada'}">${i.precio
        ? plata(i.precio_transferencia || i.precio, i.moneda) +
          (i.precio_transferencia ? `<s>${plata(i.precio, i.moneda)}</s>` : '')
        : 'Precio pendiente'}</span>
      ${i.tienda ? `<span class="tienda">${esc(i.tienda)}${i.stock ? ', ' + esc(i.stock) : ''}</span>` : ''}
      ${marcas.length ? `<span class="marcas">${marcas.slice(0,2).join('')}</span>` : ''}
      <span class="acciones">${cta}
        <button type="button" class="lupa" data-buscar="${esc(i.id)}" aria-label="Ver el detalle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
        </button></span>
    </div></li>`;
}

function pintar() {
  if (!ctrl.length) return;
  const r = filtrados();
  document.getElementById('grilla').innerHTML = r.length
    ? r.slice(0, limite).map(ficha).join('')
    : '<li class="vacio">Ningun tomo coincide. Proba quitando un filtro.</li>';
  document.getElementById('conteo').textContent = r.length
    ? Math.min(limite, r.length) + ' de ' + r.length + ' tomos' : '';
  const faltan = Math.max(0, r.length - limite);
  const mas = document.getElementById('mas');
  mas.hidden = faltan === 0;
  mas.textContent = 'Mostrar ' + Math.min(120, faltan) + ' mas';
}

// Que le falta a este tomo y que desbloquea cada cosa.
function pasos(i) {
  const ed = tiendaEditorial(i);
  const p = [];
  p.push({ok: !!i.edicion_whakoom, campo:'edicion_whakoom',
    t:'Identificar la edicion en Whakoom',
    d: i.edicion_whakoom ? 'Cargada. De ahi salen tapa, titulo e idioma.'
      : 'Pega el link de la ficha de tu edicion. Es lo que destraba la tapa y el idioma.'});
  p.push({ok: !!i.editorial, campo:'editorial',
    t:'Saber de que editorial es',
    d: i.editorial ? (ed ? 'Tiene tienda propia, y por eso va primera.' : 'Cargada. No le conozco tienda propia.')
      : 'Sin esto no se puede aplicar la regla de comprar en la editorial.'});
  if (ed) p.push({ok: !!i.editorial_chequeada || i.tienda === ed.nombre, campo:null,
    t:'Revisar la tienda de la editorial',
    d: (i.editorial_chequeada || i.tienda === ed.nombre)
      ? 'Ya revisada.' : 'Abrila mas abajo y marcala como vista, aunque no tenga stock.'});
  p.push({ok: i.tipo_enlace === 'especifico', campo:'url_producto', urgente: i.estado === 'encontrado' && i.tipo_enlace !== 'especifico',
    t:'Cargar la URL del producto',
    d: i.tipo_enlace === 'especifico' ? 'Cargada. El regenerador la vigila todos los lunes.'
      : 'Sin esto el boton queda en Ver opciones y nadie revisa si el precio cambio.'});
  p.push({ok: !!i.cover_url, campo:'cover_url',
    t:'Conseguir la tapa',
    d: i.cover_url ? 'Cargada.' : 'Sale sola de Whakoom o de la pagina del producto.'});
  if (i.precio) p.push({ok: !revalidar(i), campo:null, urgente: revalidar(i),
    t:'Precio al dia',
    d: revalidar(i) ? 'Tiene mas de 30 dias o no tiene fecha. Corre Revalidar precios.'
      : 'Verificado el ' + esc(i.fecha_verificacion) + '.'});
  return p;
}

let tomoActual = null, sucio = false;

function campoHTML(c, i) {
  const val = i[c.k] == null ? '' : String(i[c.k]);
  const esc2 = s => s.replace(/"/g,'&quot;');
  let control;
  if (c.tipo === 'select') {
    control = `<select name="${c.k}">${c.opciones.map(o =>
      `<option value="${o}" ${String(i[c.k] || '') === o ? 'selected' : ''}>${
        c.k === 'estado' ? NOMBRE_ESTADO[o] : (o || 'sin dato')}</option>`).join('')}</select>`;
  } else if (c.tipo === 'textarea') {
    control = `<textarea name="${c.k}">${esc(val)}</textarea>`;
  } else {
    control = `<input name="${c.k}" type="${c.tipo || 'text'}" value="${esc2(val)}">`;
  }
  return `<label class="${c.ancho ? 'ancho' : ''}" data-campo="${c.k}">${c.l}${control}${
    c.pista ? `<span class="pista">${c.pista}</span>` : ''}</label>`;
}

function irATomo(id) { location.hash = '#/tomo/' + id; }
function volverALista() { location.hash = ''; }

function ruta() {
  const m = location.hash.match(/^#\/tomo\/(.+)$/);
  const lista = document.getElementById('lista');
  const det = document.getElementById('detalle');
  if (m) {
    const it = ITEMS.find(x => x.id === decodeURIComponent(m[1]));
    if (it) { lista.hidden = true; det.hidden = false; renderDetalle(it); window.scrollTo(0,0); return; }
  }
  det.hidden = true; lista.hidden = false; tomoActual = null;
}

function renderDetalle(i) {
  tomoActual = i.id; sucio = false;
  const q = encodeURIComponent(termino(i));
  const ed = tiendaEditorial(i);
  const punto = {encontrado:'enc', no_encontrado:'ne', pendiente:'pen', descartada:'desc'}[i.estado];
  const enlace = t => `<li><a href="${t.u}${t.sinTermino ? '' : q}" target="_blank" rel="noopener"
      class="${t.ed && t.ed === i.editorial ? 'oficial' : ''}"><span>${esc(t.n)}
      <small>${t.ed && t.ed === i.editorial ? 'la editorial' + (t.manual ? ', hay que mirarla a mano' : '')
        : (t.nota || 'buscar ahi')}</small></span></a></li>`;
  const ar = TIENDAS_AR.filter(t => t.ed && t.ed === i.editorial)
    .concat(TIENDAS_AR.filter(t => !(t.ed && t.ed === i.editorial)));

  let cta;
  if (i.tipo_enlace === 'especifico') cta = `<a href="${esc(i.url_producto)}" target="_blank" rel="noopener">Comprar en ${esc(i.tienda || 'la tienda')}</a>`;
  else if (i.tipo_enlace === 'general') cta = `<a class="suave" href="${esc(i.url_general)}" target="_blank" rel="noopener">Ver opciones</a>`;
  else cta = `<button disabled>${i.estado === 'no_encontrado' ? 'Sin publicacion' : 'Todavia sin buscar'}</button>`;

  const m = mercado(i);
  const pendientes = pasos(i).filter(x => !x.ok).length;

  const bloqueTiendas = () => {
    if (m === 'us') return `<h4>Tiendas de Estados Unidos</h4><ol>${TIENDAS_EN.map(enlace).join('')}</ol>
      <h4>Y el mercado de usado</h4><ol>${[TIENDAS_EN[3]].map(enlace).join('')}</ol>`;
    let out = '';
    if (m === 'es') out += `<div class="mercado">Es una edicion espanola: llega por importacion.
      Las comiquerias argentinas suelen traerla, y si no, hay que mirar Buscalibre o librerias de Espana a mano.</div>`;
    out += `<h4>Comiquerias argentinas</h4><ol>${ar.map(enlace).join('')}</ol>
      <h4>Marketplaces</h4><ol>${MARKETPLACES.map(enlace).join('')}</ol>`;
    return out;
  };

  const bloqueTapa = () => {
    if (i.cover_url) return `<div class="tapabox"><p>La tapa esta cargada. Si no te convence, podes reemplazar
      la direccion en el campo URL de la tapa, o dejar que la traiga alguno de los dos procesos.</p>
      <div class="acc"><button type="button" class="suave" data-foco="cover_url">Cambiarla a mano</button></div></div>`;
    const acc = [];
    if (i.edicion_whakoom) acc.push(`<button type="button" data-wf="tapas">Traer la tapa desde Whakoom</button>`);
    if (i.tipo_enlace === 'especifico') acc.push(`<button type="button" data-wf="refresh">Bajarla de la pagina del producto</button>`);
    acc.push(`<button type="button" class="suave" data-foco="cover_url">Pegar la direccion a mano</button>`);
    return `<div class="tapabox">
      <p>${i.edicion_whakoom
        ? 'Esta colección tiene ficha de edicion cargada, asi que la tapa plana sale de ahi en una corrida.'
        : i.tipo_enlace === 'especifico'
          ? 'No hay ficha de Whakoom, pero si hay pagina de producto: el regenerador puede bajar la imagen de la tienda.'
          : 'No hay de donde sacarla todavia. Lo que la destraba es cargar la ficha de tu edicion en Whakoom, que da la tapa plana de todos los tomos de la coleccion de una vez. Buscala en tu comicteca.'}</p>
      <div class="acc">${acc.join('')}
        ${!i.edicion_whakoom ? `<a class="suave" href="https://www.whakoom.com/marianodi/collection" target="_blank" rel="noopener">Abrir mi comicteca</a>` : ''}
      </div></div>`;
  };

  document.getElementById('detalle').innerHTML = `
    <button type="button" class="volver" data-volver>Volver al catalogo</button>
    <div class="dcols">
      <div class="dizq">
        ${i.cover_url
          ? `<img class="dtapa" src="${esc(i.cover_url)}" alt="Tapa de ${esc(i.coleccion)} ${esc(i.numero)}">`
          : `<div class="dtapa ph">${esc(i.numero)}</div>`}
        <div class="dcta">${cta}
          <button type="button" class="suave" data-pedir="${esc(i.id)}">Pedir que lo busque</button></div>
      </div>

      <div class="dder">
        <span class="linea"><span class="punto ${punto}"></span>${esc(i.coleccion)}, ${NOMBRE_ESTADO[i.estado].toLowerCase()}</span>
        <h2 class="dtit">${esc(i.numero)}${i.titulo ? ' ' + esc(i.titulo) : ''}</h2>

        <dl class="meta">
          <dt>Editorial</dt><dd class="${i.editorial ? '' : 'falta'}">${i.editorial ? esc(i.editorial) : 'sin identificar'}</dd>
          <dt>Idioma</dt><dd class="${i.idioma ? '' : 'falta'}">${i.idioma ? esc(i.idioma) : 'sin identificar'}</dd>
          <dt>ISBN</dt><dd class="${i.isbn ? '' : 'falta'}">${i.isbn ? esc(i.isbn) : 'sin identificar'}</dd>
          ${i.precio ? `<dt>Precio</dt><dd>${plata(i.precio, i.moneda)}${i.precio_transferencia
            ? ', ' + plata(i.precio_transferencia, i.moneda) + ' por transferencia' : ''} en ${esc(i.tienda)}${
            i.fecha_verificacion ? ', visto el ' + esc(i.fecha_verificacion) : ''}</dd>` : ''}
          ${i.stock ? `<dt>Stock</dt><dd>${esc(i.stock)}</dd>` : ''}
          ${i.envio ? `<dt>Envio</dt><dd>${esc(i.envio)}</dd>` : ''}
          ${i.observaciones ? `<dt>Notas</dt><dd>${esc(i.observaciones)}</dd>` : ''}
        </dl>

        <div class="tabs" role="tablist">
          <button type="button" data-hoja="comprar" aria-selected="true">Donde comprarlo</button>
          <button type="button" data-hoja="completar" aria-selected="false">Completar${
            pendientes ? `<span class="aviso">${pendientes}</span>` : ''}</button>
          <button type="button" data-hoja="historial" aria-selected="false">Historial</button>
        </div>

        <div class="hoja" id="hoja-comprar">
          ${m ? `<div class="mercado">Mercado: <b>${NOMBRE_MERCADO[m]}</b>.
            ${m === 'us' ? 'Es una edicion americana, asi que no tiene sentido buscarla en comiquerias argentinas.'
              : 'Es una edicion en castellano: las tiendas de Estados Unidos no la venden.'}</div>`
            : `<div class="mercado">Falta el idioma, asi que te muestro todas las tiendas.
               Cargalo en la pestana Completar y esta lista se achica a las que sirven.</div>`}

          ${ed ? `<h4>La editorial${i.editorial_chequeada ? ', vista el ' + esc(i.editorial_chequeada) : ' todavia no se miro'}</h4>
            <ol><li><a class="oficial" href="${esc(ed.url)}${ed.manual ? '' : 'search/?q=' + q}" target="_blank" rel="noopener">
              <span>${esc(ed.nombre)}<small>${ed.manual ? 'bloquea la lectura automatica, miralo vos' : 'buscar ahi'}</small></span></a>
              ${editable() ? `<button type="button" class="mini" data-chequeada="${esc(i.id)}">Marcar como vista y guardar</button>` : ''}</li></ol>`
            : (i.editorial ? '' : `<h4>La editorial</h4><p class="nota">No se sabe de que editorial es, asi que no puedo decirte cual es la tienda que va primero.</p>`)}

          ${(i.candidatos || []).length ? `<h4>Candidatos encontrados</h4>
            <ol>${i.candidatos.map((c, n) => `<li><a class="${c.vigente === false ? 'caido' : ''}"
              href="${esc(c.url)}" target="_blank" rel="noopener">
              <span>${esc(c.tienda)}${c.precio == null ? '' : ' ' + plata(c.precio, c.moneda)}
                <small>${esc(c.titulo_publicacion || '')}${c.stock == null ? '' : ', ' + esc(String(c.stock))}</small>
                ${c.nota ? `<small>${esc(c.nota)}</small>` : ''}</span>
              <span class="conf ${esc(c.confianza)}">${esc(c.confianza)}</span></a>
              ${editable() && c.vigente !== false ? `<button type="button" class="mini"
                data-promover="${esc(i.id)}" data-cand="${n}">Usar esta y guardar</button>` : ''}</li>`).join('')}</ol>` : ''}

          ${bloqueTiendas()}
        </div>

        <div class="hoja" id="hoja-completar" hidden>
          <ol class="pasos">${pasos(i).map(x => `<li class="${x.ok ? 'ok' : ''}${x.urgente ? ' urgente' : ''}">
            <span class="marca-paso">${x.ok ? '\u2713' : '!'}</span>
            <span><b>${x.t}</b><span>${x.d}</span>${!x.ok && x.campo && editable()
              ? `<br><button type="button" data-foco="${x.campo}">Completar ahora</button>` : ''}</span></li>`).join('')}</ol>

          <h4>Conseguir la tapa</h4>
          ${bloqueTapa()}

          ${editable() ? `<form id="fdet" data-id="${esc(i.id)}">
            ${SECCIONES.map(s => `<div class="seccion"><h5>${s.titulo}</h5><p class="para">${s.para}</p>
              <div class="campos">${s.campos.map(c => campoHTML(c, i)).join('')}</div></div>`).join('')}
          <div class="guardabarra">
            <button type="button" id="bguardar" disabled>Guardar cambios</button>
            <span class="estado" id="edet">Cambia algun campo para poder guardar.</span>
          </div></form>`
          : `<p class="nota">Activa la edicion en Herramientas para poder cambiar estos datos.</p>`}
        </div>

        <div class="hoja" id="hoja-historial" hidden>
          ${(i.historial || []).length
            ? `<div class="hist">${i.historial.map(x => `<span>${esc(x)}</span>`).join('')}</div>`
            : '<p class="nota">Todavia no hay movimientos registrados en este tomo.</p>'}
        </div>
      </div>
    </div>`;

  const f = document.getElementById('fdet');
  if (f) f.addEventListener('input', () => {
    sucio = true;
    document.getElementById('bguardar').disabled = false;
    const e = document.getElementById('edet');
    e.className = 'estado'; e.textContent = 'Hay cambios sin guardar.';
  });
}

async function guardarDetalle() {
  const f = document.getElementById('fdet');
  const e = document.getElementById('edet');
  const b = document.getElementById('bguardar');
  b.disabled = true; e.className = 'estado'; e.textContent = 'Guardando.';
  try {
    const campos = leerForm(f);
    cola.set(f.dataset.id, Object.assign(cola.get(f.dataset.id) || {}, campos));
    const it = ITEMS.find(x => x.id === f.dataset.id);
    if (it) Object.assign(it, campos);
    await guardarCambios(true);
    e.className = 'estado ok';
    e.textContent = 'Guardado. La pagina publicada tarda un minuto en actualizarse.';
    sucio = false;
    const actual = ITEMS.find(x => x.id === f.dataset.id);
    if (actual) renderDetalle(actual);
  } catch (err) {
    b.disabled = false;
    e.className = 'estado mal';
    e.textContent = 'No se guardo: ' + err.message;
  }
}

cargar();
