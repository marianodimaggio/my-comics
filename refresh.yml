name: Revalidar precios

on:
  schedule:
    - cron: "0 11 * * 1"   # lunes 08:00 en Argentina (UTC-3)
  workflow_dispatch:        # también se puede correr a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revalidar
        run: python3 scripts/refresh.py

      - name: Commitear si algo cambió
        run: |
          git config user.name  "regenerador"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Revalidación automática de precios ($(date +%F))"
            git push
          fi
