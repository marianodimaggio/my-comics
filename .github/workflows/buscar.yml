name: Buscar candidatos

on:
  workflow_dispatch:
    inputs:
      coleccion:
        description: "Nombre exacto de la coleccion (vacio = los pendientes mas prioritarios)"
        required: false
        default: ""
      cantidad:
        description: "Cuantos tomos procesar si no indicas coleccion"
        required: false
        default: "10"

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar
        run: |
          if [ -n "${{ inputs.coleccion }}" ]; then
            python3 scripts/buscar.py --coleccion "${{ inputs.coleccion }}"
          else
            python3 scripts/buscar.py --pendientes "${{ inputs.cantidad }}"
          fi

      - name: Commitear
        run: |
          git config user.name  "buscador"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Busqueda automatica de candidatos ($(date +%F))"
          # Si alguien escribio en el repo mientras esto corria, se reintenta
          # poniendo los cambios propios encima de los ajenos, sin pisarlos.
          for intento in 1 2 3 4 5; do
            if git push; then
              echo "Subido en el intento $intento."
              exit 0
            fi
            echo "El repositorio cambio, reintento $intento."
            git pull --rebase --autostash origin main || exit 1
            sleep 3
          done
          echo "No pude subir despues de 5 intentos."
          exit 1
