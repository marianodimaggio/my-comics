name: Revalidar precios

on:
  schedule:
    - cron: "0 11 * * 1"   # lunes 08:00 en Argentina (UTC-3)
  workflow_dispatch:        # también se puede correr a mano desde la pestaña Actions
    inputs:
      id:
        description: "Id de un tomo puntual (vacio = todos los que tengan URL)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revalidar
        run: |
          if [ -n "${{ inputs.id }}" ]; then
            python3 scripts/refresh.py --id "${{ inputs.id }}"
          else
            python3 scripts/refresh.py
          fi

      - name: Commitear
        run: |
          git config user.name  "regenerador"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Revalidacion automatica de precios ($(date +%F))"
          # Si alguien escribio en el repo mientras esto corria, se reintenta
          # poniendo los cambios propios encima de los ajenos, sin pisarlos.
          for intento in 1 2 3 4 5; do
            if git push; then
              echo "Subido en el intento $intento."
              exit 0
            fi
            echo "El repositorio cambio, reintento $intento."
            git pull --rebase --autostash origin main || exit 1
            sleep 3
          done
          echo "No pude subir despues de 5 intentos."
          exit 1
